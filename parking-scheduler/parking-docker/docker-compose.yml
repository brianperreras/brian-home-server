# Unraid 7.3.2 + Compose Manager Plus.
# Place this stack under: /mnt/user/appdata/compose-projects/parking/
#
# Single config file: .env beside this compose file (Compose → parking → .ENV).
# Copy from .env.example, set RS_USERNAME / RS_PASSWORD / PARKING_SLOTS, then
# Compose Up. Entrypoint materializes SSO/schedule/reservation/slots from env.
# Full steps: UNRAID.md

services:
  parking:
    build:
      context: .
      dockerfile: Dockerfile
    image: parking-automation:local
    container_name: parking
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Manila}
      HOME: /data/home
      PARKING_ROOT: /app/parking
      PARKING_CONFIG_DIR: /data/config
      PARKING_LOCAL_CREDENTIALS_ONLY: ${PARKING_LOCAL_CREDENTIALS_ONLY:-1}
      PARKING_MANAGE_FROM_STACK_ENV: ${PARKING_MANAGE_FROM_STACK_ENV:-1}
    volumes:
      - ${PARKING_APPDATA:-./unraid-appdata}/home:/data/home
      # Generated config snapshots (entrypoint writes these from stack .env)
      - ${PARKING_APPDATA:-./unraid-appdata}/config:/data/config
      # Session + logs (survive image rebuilds)
      - ${PARKING_APPDATA:-./unraid-appdata}/output:/app/parking/resource-scheduler-sso-login/output
      - ${PARKING_APPDATA:-./unraid-appdata}/logs-sso:/app/parking/resource-scheduler-sso-login/logs
      - ${PARKING_APPDATA:-./unraid-appdata}/logs-book:/app/parking/resource-scheduler/logs
    # No host ports — outbound HTTPS only (SSO + Resource Scheduler)
